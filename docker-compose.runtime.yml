# Catalog Authority — ordinary-computer runtime stack (Linux, macOS or Windows with Docker Desktop).
#
# This is the file to use if you just want to RUN the operator UI on a normal machine. The repository root
# docker-compose.yml is a CI harness (`npm run ci` against a throwaway Postgres) and is not a deployment;
# docker-compose.unraid.runtime.yml is the Unraid/Arcane launcher stack. Neither is changed by this file.
#
#   1. ./deploy/local-runtime-setup.sh          generate secrets + create the artifact folder
#      (Windows: powershell -ExecutionPolicy Bypass -File .\deploy\local-runtime-setup.ps1)
#   2. docker compose -f docker-compose.runtime.yml up -d
#   3. open http://127.0.0.1:8099/  and paste the token from ./secrets/operator_ui_token
#   4. docker compose -f docker-compose.runtime.yml down
#
# WHAT IT RUNS: postgres, a one-shot `migrate` container that finishes before anything else starts, plus one
# long-running read-only operator UI on 8099. There is no second web server: the promotion record chain is a
# panel inside this UI, behind the same operator token as every other operational route.
#
# THE DATABASE MIGRATES ITSELF, ONCE, BEFORE THE APP EXISTS. v1.1.0 shipped without this, and a first run
# produced a healthy-looking UI in front of an empty database that only a command appearing in no instruction
# could fix. `migrate` runs `ops:bootstrap`, which is idempotent (safe on every `up`, not just the first),
# serialised by a PostgreSQL advisory lock (two racing containers produce one migration and one no-op), and
# fail-closed: the app declares `service_completed_successfully`, so a migration that fails means the app
# container is never started at all. There is no window in which the UI is reachable against a schema it
# cannot use.
#
# THE APP IMAGE IS PREBUILT AND VERSION-PINNED (never `latest`) — nothing here is built from source, so this
# file works unchanged inside the release bundle, on a machine with no checkout and no Node.js. Maintainers
# who want a local build add the override:
#   docker compose -f docker-compose.runtime.yml -f docker-compose.runtime.build.yml up -d --build
#
# THE PROMOTION RECORDS FOLDER is yours and is mounted READ-ONLY (`:ro`). The container cannot write to it,
# and the path is fixed by configuration — no browser input, no upload, no form chooses it. Point it at a
# different host folder with PROMOTION_RECORDS_HOST_DIR and restart.
#
# It contacts no provider, no media server and no library. It performs no promotion, approval, execution,
# archival or deletion.

name: catalogauthority-local

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets:
      - postgres_password
    # Never published to the host: only the app service needs it, over the compose network.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalog"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    # Postgres initialises its data directory as root before dropping privileges, so it is NOT run read-only
    # or with every capability dropped — doing so breaks first boot. It is bounded and restart-policed
    # instead, and it holds no operator secret beyond its own password file.
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ONE-SHOT, AND THE ONLY THING IN THIS STACK THAT RUNS AS ROOT. Phase 263.
  #
  # WHY IT HAS TO EXIST. Docker initialises a named volume from what the IMAGE has at that path — ownership
  # included — and only ONCE, the first time the volume is created. Dockerfile.runtime now ships the keystore
  # directory owned by `node`, which fixes every installation made from that image onwards and fixes nothing
  # for a volume that already exists. An installation from v1.1.2 or earlier still has a root-owned keystore
  # that the non-root app cannot write, which is `EACCES` on the first custodian construction: ops:doctor,
  # /api/status and the entire catalog panel. No image change can reach back into an existing volume; only
  # something with the authority to chown can, and this is that something.
  #
  # HOW NARROW IT IS. It mounts the keystore volume and NOTHING else — no database URL, no secrets, no import
  # folder, no promotion records. `network_mode: none` gives it no network at all, so it cannot contact
  # anything even in principle. It keeps `read_only: true` (its writes land on the volume), drops every
  # capability and adds back exactly the three that changing ownership needs. It runs, decides, and exits.
  #
  # WHAT IT IS ALLOWED TO DO. Create the keystore directory if it is missing, and change the OWNER of what is
  # already there. It never reads, writes, moves or deletes key material, never regenerates a secret, and
  # never destroys or recreates a volume. An ownership or content state it does not understand — a symlink, a
  # device node, two different foreign owners, an entry that is not part of a keystore — is REFUSED with a
  # named code and nothing changed, and because `app` and `migrate` gate on this exiting zero, a refusal stops
  # the stack instead of letting it start against a keystore nobody understands.
  #
  # IT IS IDEMPOTENT AND FREE AFTER THE FIRST RUN. A correct keystore reports ALREADY_CORRECT and performs no
  # filesystem write at all, so leaving this in the startup path costs nothing on every subsequent `up`.
  #
  # THE LONG-RUNNING APP IS UNCHANGED: still `user: "node"`, still `read_only: true`, still `cap_drop: ALL`,
  # still `no-new-privileges`. Elevated authority lives here, for a few milliseconds, and nowhere else.
  keystore-prepare:
    image: ${CATALOG_AUTHORITY_IMAGE:-ghcr.io/cdb8457/catalog-authority-ops:v1.1.2}
    init: true
    restart: "no"
    environment:
      CUSTODIAN_KEYSTORE_DIR: /var/lib/catalog/keystore
      # The user the app and migrate services run as, named once so the repair and the services cannot drift.
      CATALOG_KEYSTORE_OWNER: node
      NPM_CONFIG_CACHE: /tmp/npm-cache
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    volumes:
      - keystore:/var/lib/catalog/keystore
    entrypoint: ["npm", "run"]
    command: ["ops:keystore-repair"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      # Exactly what changing an owner and tightening a directory mode needs, and nothing else. CHOWN to set
      # the owner, FOWNER to change the mode of a directory this process does not own, DAC_OVERRIDE to walk
      # into a tree whose permissions were written for somebody else.
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    user: "0:0"
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ONE-SHOT. Runs to completion on every `up`, then exits. It is not a server, has no ports, publishes
  # nothing, and never restarts — `restart: "no"` is load-bearing, because a restarting one-shot would race
  # itself and could never satisfy `service_completed_successfully`.
  #
  # It holds the OWNER credential (ADMIN_DATABASE_URL) that the long-running app deliberately also holds for
  # its self-check, plus the completion secret it provisions. It does NOT mount the promotion records folder:
  # a migration has no business reading anyone's evidence.
  migrate:
    image: ${CATALOG_AUTHORITY_IMAGE:-ghcr.io/cdb8457/catalog-authority-ops:v1.1.2}
    init: true
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      # Phase 263. `ops:bootstrap` constructs a FileCustodian, so it is the FIRST thing an unwritable keystore
      # kills. It waits for the repair to exit zero for the same reason the app waits for this: a refusal must
      # stop the stack, not surface later as a half-installed UI.
      keystore-prepare:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      ADMIN_DATABASE_URL_FILE: /run/secrets/admin_database_url
      DATABASE_URL_FILE: /run/secrets/database_url
      CUSTODIAN_MODE: file
      COMPLETION_SECRET_FILE: /run/secrets/completion_secret
      CUSTODIAN_KEYSTORE_DIR: /var/lib/catalog/keystore
      CUSTODIAN_KEK_FILE: /run/secrets/custodian_kek
      NPM_CONFIG_CACHE: /tmp/npm-cache
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    volumes:
      - keystore:/var/lib/catalog/keystore
    secrets:
      - admin_database_url
      - database_url
      - completion_secret
      - custodian_kek
    entrypoint: ["npm", "run"]
    command: ["ops:bootstrap"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "node"
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  app:
    # A PREBUILT, VERSION-PINNED image. An ordinary install pulls this and never needs a source checkout, a
    # Node.js toolchain or a build step. The default is a concrete version tag, never `latest`, so `up -d`
    # cannot silently move you to a different build.
    #
    # Pin harder by digest (what the release bundle records for you):
    #   CATALOG_AUTHORITY_IMAGE=ghcr.io/cdb8457/catalog-authority-ops@sha256:<digest>
    #
    # Maintainers building from source use the documented override instead — see
    # docker-compose.runtime.build.yml — which replaces this image with a locally built one.
    image: ${CATALOG_AUTHORITY_IMAGE:-ghcr.io/cdb8457/catalog-authority-ops:v1.1.2}
    # PID 1 is a real init that reaps orphans; the app process still receives SIGTERM directly.
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # THE FAIL-CLOSED GATE. `up -d` does not start this container until `migrate` has exited ZERO. A failed
      # migration therefore produces no UI at all, rather than a UI that reports itself healthy in front of a
      # database it cannot use — which is exactly what v1.1.0 did.
      migrate:
        condition: service_completed_successfully
      # Phase 263. Declared here as well as on `migrate`, rather than relied on transitively: this is the
      # container that dies with EACCES when the keystore is not writable, so the dependency that guarantees a
      # repaired keystore belongs on it directly. A refusal means no UI at all, which is the correct outcome.
      keystore-prepare:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      ADMIN_DATABASE_URL_FILE: /run/secrets/admin_database_url
      DATABASE_URL_FILE: /run/secrets/database_url
      CUSTODIAN_MODE: file
      COMPLETION_SECRET_FILE: /run/secrets/completion_secret
      CUSTODIAN_KEYSTORE_DIR: /var/lib/catalog/keystore
      CUSTODIAN_KEK_FILE: /run/secrets/custodian_kek
      OPERATOR_UI_TOKEN_FILE: /run/secrets/operator_ui_token
      # The fixed container path the promotion record artifacts are mounted at, read-only.
      PROMOTION_RECORDS_DIR: /var/lib/catalog/promotion-records
      # Phase 259. The fixed container path YOUR catalog snapshot folder is mounted at, READ-ONLY. Every
      # `ops:catalog-import` run resolves its `--file` inside this directory, after symlinks, so a snapshot
      # cannot name a path outside the folder you mounted for it. Change the host side with
      # CATALOG_IMPORT_HOST_DIR and restart. Nothing about it is chosen from a browser: the import is a
      # command an operator runs, and the UI only ever reads what it produced.
      CATALOG_IMPORT_DIR: /var/lib/catalog/import
      # WHAT THE BUNDLE BELIEVES IT DEPLOYED, and the reference it asked Docker for. Neither of these is the
      # image's own claim about itself — that is baked into the image by Dockerfile.runtime and cannot be set
      # from here. Two independent declarations is the whole point: the UI compares them and reports MISMATCH
      # when a .env was edited without extracting the matching bundle, instead of letting the two drift
      # silently. Empty is fine and honest: the UI then says the bundle declared nothing.
      CATALOG_AUTHORITY_BUNDLE_VERSION: ${CATALOG_AUTHORITY_BUNDLE_VERSION:-}
      CATALOG_AUTHORITY_IMAGE: ${CATALOG_AUTHORITY_IMAGE:-}
      # /healthz answers 503 until the database reports the schema version this build requires. The `migrate`
      # gate above already makes that true before this container starts; this is the second line, for a
      # container started outside this file's ordering. Turning it off makes /healthz a bare liveness probe.
      OPERATOR_UI_HEALTHZ_REQUIRES_SCHEMA: "1"
      NPM_CONFIG_CACHE: /tmp/npm-cache
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    volumes:
      # YOUR folder, mounted READ-ONLY. The container cannot write, rename or delete anything in it.
      - ${PROMOTION_RECORDS_HOST_DIR:-./promotion-records}:/var/lib/catalog/promotion-records:ro
      # YOUR catalog snapshots, mounted READ-ONLY for the same reason: an import reads a file you wrote and
      # has no business being able to change it.
      - ${CATALOG_IMPORT_HOST_DIR:-./import}:/var/lib/catalog/import:ro
      - keystore:/var/lib/catalog/keystore
    secrets:
      - admin_database_url
      - database_url
      - completion_secret
      - custodian_kek
      - operator_ui_token
    entrypoint: ["npm", "run"]
    command: ["ops:operator-ui-server", "--", "--serve", "--host", "0.0.0.0", "--port", "8099"]
    # Loopback-published by default: the UI is reachable from THIS machine only unless you deliberately
    # change the bind address below.
    ports:
      - "${OPERATOR_UI_BIND_ADDRESS:-127.0.0.1}:${OPERATOR_UI_HOST_PORT:-8099}:8099"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:8099/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "node"
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
  keystore:      # kept separate from pgdata so a database backup never contains key material

# Operator-provided files under ./secrets/ (gitignored), created by either setup script under ./deploy/.
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  admin_database_url:
    file: ./secrets/admin_database_url
  database_url:
    file: ./secrets/database_url
  completion_secret:
    file: ./secrets/completion_secret
  custodian_kek:
    file: ./secrets/custodian_kek
  operator_ui_token:
    file: ./secrets/operator_ui_token
