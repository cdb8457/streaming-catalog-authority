# Projection Phase 1 — a real, migrated PostgreSQL for the SERVE-DEATH gate.
#
# WHY A SEPARATE FILE, AND A SEPARATE PORT. `docker-compose.yml` is the ordinary development stack and binds
# 5432. `docker-compose.projection-publisher.yml` binds 5470, `…-jellyfin.yml` 5480, `…-plex.yml` 5490,
# `…-emby.yml` 5500, `…-three.yml` 5510, `…-lease.yml` 5540, `…-lifecycle.yml` 5550. This one has to be
# startable BESIDE all of them — a previous run, or another gate, or an installation, must not be able to lend
# it state. So it takes its own project name, its own network, its own port, and throwaway storage.
#
# THE DAEMON IS NOT HERE, and its absence is deliberate. `deploy/projection-serve-death-gate.sh` starts it
# itself, with the narrow authority a FUSE mount needs (/dev/fuse, CAP_SYS_ADMIN, root inside the container).
# Writing that into a Compose file next to a database would make it look like a deployment shape somebody
# should copy. It is a measurement rig: the gate's whole subject is what the daemon does when its serve loop is
# torn out from under it, so the daemon's launch flags are the experiment, and they belong in the script that
# runs it, not in a file that reads as infrastructure.

name: projection-serve-death-gate

services:
  postgres:
    # PINNED BY DIGEST, like every other external image this gate touches. A moving tag would mean two
    # consecutive runs of the same gate were runs of possibly different things, which is not what the
    # assertion is for.
    image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${PROJECTION_SERVE_DEATH_GATE_PG_PORT:-5560}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalog"]
      interval: 3s
      timeout: 5s
      retries: 20
    tmpfs:
      # Throwaway, and it says so in the only way that cannot be forgotten: its storage does not survive the
      # container. A gate that left a volume behind would eventually be run against the previous run's state,
      # and "it passed" would stop meaning "it passed from nothing".
      - /var/lib/postgresql/data

networks:
  default:
    name: projection-serve-death-gate
