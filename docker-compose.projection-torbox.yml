# Projection Phase 1 — a real, migrated PostgreSQL for the TORBOX-TO-MOUNT gate.
#
# WHY A SEVENTH DATABASE COMPOSE FILE. `docker-compose.yml` is the development stack and binds 5432.
# `docker-compose.projection-publisher.yml` binds 5470, `…-jellyfin.yml` 5480, `…-plex.yml` 5490,
# `…-emby.yml` 5500, `…-three.yml` 5510. This one has to be startable BESIDE all six — the point of running a
# gate three times in a row is that a previous run, or another gate, or an installation, must not be able to
# lend it state. So it takes its own project name, its own network, its own port, and throwaway storage.
#
# NEITHER THE DAEMON, THE RESOLVER NOR THE FIXTURE IS HERE, and on this gate that omission is doing real
# work. The arrangement the gate builds -- a resolver container sharing the DAEMON'''S NETWORK NAMESPACE so it
# stays loopback-only -- is a measurement rig, not a deployment. Written into a Compose file it would read as
# something to copy, and copying it is exactly wrong: in production the resolver runs beside the daemon on
# the host, holding the only copy of the TorBox API key.
#
# THE PORT IS 5570 SO THIS RUNS BESIDE ALL EIGHT OTHER GATE DATABASES.

name: projection-torbox-gate

services:
  postgres:
    # PINNED BY DIGEST, like every other external image this gate touches. A moving tag would mean three
    # consecutive runs were three runs of possibly different things, which is not what the repetition is for.
    image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${PROJECTION_TORBOX_GATE_PG_PORT:-5570}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalog"]
      interval: 3s
      timeout: 5s
      retries: 20
    tmpfs:
      # Throwaway, and it says so in the only way that cannot be forgotten: its storage does not survive the
      # container. Three consecutive runs mean three runs from nothing, or they mean very little.
      - /var/lib/postgresql/data

networks:
  default:
    name: projection-torbox-gate
