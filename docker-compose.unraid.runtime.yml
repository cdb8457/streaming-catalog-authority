# Launcher/runtime Unraid stack for Catalog Authority.
#
# Use this file when a launcher such as Arcane cannot use the repository directory as a Docker
# build context. It defaults to the locally built repo-ops:latest image and can be pointed at a
# published image with CATALOG_AUTHORITY_OPS_IMAGE.
#
# Runtime steady state:
#   postgres stays running
#   app is the long-running read-only operator API/UI on port 8099
#   ops is a one-shot command container and exits after the command completes
#
# Defaults are the canonical Unraid release paths. Phase 155 fresh-deploy smoke may override
# CATALOG_AUTHORITY_APPDATA_DIR and OPERATOR_UI_HOST_PORT to avoid touching existing deployments.

name: catalogauthority

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - ${CATALOG_AUTHORITY_APPDATA_DIR:-/mnt/user/appdata/catalog}/pgdata:/var/lib/postgresql/data
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalog"]
      interval: 5s
      timeout: 5s
      retries: 10

  # AUTOMATIC first-run/startup migration. Runs to completion on every `up`, then exits.
  #
  # Phase 253. This stack had a one-shot `ops` container defaulting to `ops:migrate`, but starting the stack
  # never ran it — `up -d postgres app sidecar` does not include `ops`, so an operator had to know to invoke
  # the migration by hand. That is the v1.1.0 first-run defect: a UI reporting itself healthy in front of an
  # empty database.
  #
  # Kept SEPARATE from `ops` deliberately: `ops` is the manual, on-demand CLI surface with its own backups
  # and token mounts, and folding a startup gate into it would make every hand-run command a gate too.
  #
  # CUSTODIAN_MODE is `sidecar` here, matching this stack. In that mode `ops:bootstrap` does NOT provision the
  # completion secret — the sidecar owns it, and this container is not given it — so the step is reported as
  # SKIPPED rather than silently assumed. Everything else (schema, runtime credential, verification) still
  # runs, and the sidecar is not a dependency of any of it.
  migrate:
    image: ${CATALOG_AUTHORITY_OPS_IMAGE:-repo-ops:latest}
    restart: "no"   # a restarting one-shot races itself and can never satisfy service_completed_successfully
    depends_on:
      postgres:
        condition: service_healthy
      # Phase 284. The migration talks to the custodian, so it waits for a sidecar that has ANSWERED a health
      # handshake — not for one whose socket file happens to be there.
      sidecar:
        condition: service_healthy
    environment:
      APP_ENV: production
      ADMIN_DATABASE_URL_FILE: /run/secrets/admin_database_url
      DATABASE_URL_FILE: /run/secrets/database_url
      CUSTODIAN_MODE: sidecar
      CUSTODIAN_SIDECAR_SOCKET_PATH: /run/catalog-sidecar/catalog-sidecar.sock
      NPM_CONFIG_CACHE: /tmp/npm-cache
    volumes:
      - ${CATALOG_AUTHORITY_APPDATA_DIR:-/mnt/user/appdata/catalog}/sidecar/run:/run/catalog-sidecar
    secrets:
      - admin_database_url
      - database_url
    entrypoint: ["npm", "run"]
    command: ["ops:bootstrap"]

  # One-shot ops/CLI container, UNCHANGED and still manual: `docker compose run --rm ops <script>` for the
  # doctor, backups and KEK rotation. It is not part of starting the stack; `migrate` above is.
  ops:
    image: ${CATALOG_AUTHORITY_OPS_IMAGE:-repo-ops:latest}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      ADMIN_DATABASE_URL_FILE: /run/secrets/admin_database_url
      DATABASE_URL_FILE: /run/secrets/database_url
      CUSTODIAN_MODE: sidecar
      CUSTODIAN_SIDECAR_SOCKET_PATH: /run/catalog-sidecar/catalog-sidecar.sock
      OPERATOR_UI_TOKEN_FILE: ${CATALOG_AUTHORITY_APPDATA_DIR:-/mnt/user/appdata/catalog}/secrets/operator_ui_token
    volumes:
      - ${CATALOG_AUTHORITY_APPDATA_DIR:-/mnt/user/appdata/catalog}/sidecar/run:/run/catalog-sidecar
      - ${CATALOG_AUTHORITY_APPDATA_DIR:-/mnt/user/appdata/catalog}/backups:/backups
      - ${CATALOG_AUTHORITY_APPDATA_DIR:-/mnt/user/appdata/catalog}/backups:${CATALOG_AUTHORITY_APPDATA_DIR:-/mnt/user/appdata/catalog}/backups
      - ${CATALOG_AUTHORITY_APPDATA_DIR:-/mnt/user/appdata/catalog}/secrets/operator_ui_token:${CATALOG_AUTHORITY_APPDATA_DIR:-/mnt/user/appdata/catalog}/secrets/operator_ui_token
    secrets:
      - admin_database_url
      - database_url
    entrypoint: ["npm", "run"]
    command: ["ops:migrate"]

  sidecar:
    image: ${CATALOG_AUTHORITY_OPS_IMAGE:-repo-ops:latest}
    restart: unless-stopped
    environment:
      APP_ENV: production
      SIDECAR_SOCKET_PATH: /run/catalog-sidecar/catalog-sidecar.sock
      SIDECAR_STATE_DIR: /var/lib/catalog-sidecar/state
      SIDECAR_COMPLETION_SECRET_FILE: /run/secrets/completion_secret
      SIDECAR_KEK_FILE: /run/secrets/custodian_kek
      NPM_CONFIG_CACHE: /tmp/npm-cache
    volumes:
      - ${CATALOG_AUTHORITY_APPDATA_DIR:-/mnt/user/appdata/catalog}/sidecar/run:/run/catalog-sidecar
      - ${CATALOG_AUTHORITY_APPDATA_DIR:-/mnt/user/appdata/catalog}/sidecar/state:/var/lib/catalog-sidecar/state
      # ---- THE ROOT WRAPPING KEY, AND WHY IT IS A BIND AND NOT A COMPOSE SECRET ------------------------
      #
      # A PREVIOUS VERSION OF THIS FILE DECLARED IT AS A LONG-SYNTAX SECRET WITH `uid`, `gid` AND `mode`.
      # That was wrong and the comment beside it was worse, because it explained a mechanism that does not
      # exist here: OUTSIDE SWARM, Compose implements a `file:` secret as a BIND MOUNT of the source file and
      # IGNORES uid/gid/mode entirely. The container therefore saw whatever the host file's own ownership and
      # mode were, and the stack shipped with a confident comment describing a guarantee nothing enforced.
      #
      # A bind mount is what that mechanism actually is, so it is written as one. The host file's ownership
      # and mode carry through unchanged, which is exactly what the reader needs: the setup script creates it
      # owned by the runtime user and mode 0400, and REFUSES rather than continuing if it cannot. Nothing
      # here re-modes anything, because nothing here can.
      #
      # AND IT IS MOUNTED INTO THIS SERVICE ONLY. `app`, `migrate` and `ops` have no mount for it and no
      # secret entry for it, so they cannot read it however their own user is resolved.
      - ${CATALOG_AUTHORITY_APPDATA_DIR:-/mnt/user/appdata/catalog}/secrets/custodian_root_key:/run/catalog-custody/custodian_root_key:ro
    secrets:
      - completion_secret
      # PHASE 282. BOTH, DELIBERATELY, AND ONLY UNTIL A MIGRATION HAS HAPPENED. An installation that has not
      # yet run `ops:kek-ring migrate` has every wrapped key under the STATIC KEK, so removing it here would
      # leave its sidecar unable to open its own keystore. The root custody key is declared beside it so the
      # migration is possible at all. AFTER migrating, set SIDECAR_ROOT_KEY_FILE, remove SIDECAR_KEK_FILE and
      # unmount custodian_kek: the daemon refuses to start wired to both, so the cutover cannot be half done.
      - custodian_kek
      # THE ROOT KEY IS NOT HERE, AND THAT IS THE POINT. See the bind mount in `volumes:` above.
    entrypoint: ["npm", "run"]
    command: ["ops:sidecar-daemon", "--", "--serve"]
    healthcheck:
      # PHASE 284. NOT a test that the socket FILE exists. A socket appears the instant `listen` is called —
      # before the daemon has opened its state directory or established that its ring is intact — and it
      # SURVIVES a crashed process. A sidecar that serves the socket and cannot read its keystore fails every
      # request, and a fail-closed unreadable item is indistinguishable from a correctly erased one: the app
      # in front of it comes up, reports itself healthy, and shows an empty catalog with no error anywhere.
      # This is a handshake the daemon answers only after exercising its custodian against its real state.
      test: ["CMD-SHELL", "npm run --silent ops:sidecar-health -- --socket /run/catalog-sidecar/catalog-sidecar.sock"]
      interval: 10s
      timeout: 5s
      retries: 6
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m

  app:
    image: ${CATALOG_AUTHORITY_OPS_IMAGE:-repo-ops:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # THE FAIL-CLOSED GATE. Not started until `migrate` has exited ZERO, so a failed migration produces no
      # UI at all rather than one that reports itself healthy against a schema it cannot use.
      migrate:
        condition: service_completed_successfully
      # Phase 284. Every catalog read goes through the custodian, so the UI must not exist in front of a
      # sidecar that cannot serve one.
      sidecar:
        condition: service_healthy
    environment:
      APP_ENV: production
      ADMIN_DATABASE_URL_FILE: /run/secrets/admin_database_url
      DATABASE_URL_FILE: /run/secrets/database_url
      CUSTODIAN_MODE: sidecar
      CUSTODIAN_SIDECAR_SOCKET_PATH: /run/catalog-sidecar/catalog-sidecar.sock
      OPERATOR_UI_TOKEN_FILE: /run/secrets/operator_ui_token
      # /healthz answers 503 until the database reports the schema this build requires. The gate above
      # already makes that true before this container starts; this is the second line, for a container
      # started outside this file's ordering.
      OPERATOR_UI_HEALTHZ_REQUIRES_SCHEMA: "1"
    volumes:
      - ${CATALOG_AUTHORITY_APPDATA_DIR:-/mnt/user/appdata/catalog}/sidecar/run:/run/catalog-sidecar
    secrets:
      - admin_database_url
      - database_url
      - operator_ui_token
    entrypoint: ["npm", "run"]
    command: ["ops:operator-ui-server", "--", "--serve", "--host", "0.0.0.0", "--port", "8099"]
    # `--host 0.0.0.0` above is inside the container's own network namespace and reaches nothing by itself.
    # The HOST side of the mapping below is what decides who can reach this UI, and Phase 253 gave it a
    # deliberate default instead of the implicit every-interface publication it had before: an operator
    # interface on every interface of a NAS is a decision, not something to inherit by omission.
    #
    # Set OPERATOR_UI_BIND_ADDRESS to this server's LAN address to reach it from your network. The default
    # below is loopback, which means the Unraid server ITSELF and no other machine — not your laptop, not
    # another machine on the LAN, whatever address you type in a browser. Reach it over an SSH tunnel, or
    # change this deliberately.
    ports:
      - "${OPERATOR_UI_BIND_ADDRESS:-127.0.0.1}:${OPERATOR_UI_HOST_PORT:-8099}:8099"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:8099/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6

secrets:
  postgres_password:
    file: ${CATALOG_AUTHORITY_APPDATA_DIR:-/mnt/user/appdata/catalog}/secrets/postgres_password
  admin_database_url:
    file: ${CATALOG_AUTHORITY_APPDATA_DIR:-/mnt/user/appdata/catalog}/secrets/admin_database_url
  database_url:
    file: ${CATALOG_AUTHORITY_APPDATA_DIR:-/mnt/user/appdata/catalog}/secrets/database_url
  completion_secret:
    file: ${CATALOG_AUTHORITY_APPDATA_DIR:-/mnt/user/appdata/catalog}/secrets/completion_secret
  custodian_kek:
    file: ${CATALOG_AUTHORITY_APPDATA_DIR:-/mnt/user/appdata/catalog}/secrets/custodian_kek
  # PHASE 282. The ROOT WRAPPING KEY. It seals the KEK ring and is read ONLY by the sidecar, only from this
  # file, and never from an environment variable, a command line or any evidence surface. Keep it the way you
  # keep the KEK: it is the one value from which every key in the installation can be reached.
  custodian_root_key:
    file: ${CATALOG_AUTHORITY_APPDATA_DIR:-/mnt/user/appdata/catalog}/secrets/custodian_root_key
  operator_ui_token:
    file: ${CATALOG_AUTHORITY_APPDATA_DIR:-/mnt/user/appdata/catalog}/secrets/operator_ui_token
